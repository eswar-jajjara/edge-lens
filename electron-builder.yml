appId: com.edgelens.studio
productName: EdgeLens
# Optional portable directory packaging only. Teammates use the source launcher;
# this configuration does not produce or publish a setup installer.
asar: true
directories:
  output: release
files:
  - desktop/main.cjs
  - desktop/preload.cjs
  - package.json
extraResources:
  - from: desktop/engine
    to: engine
  - from: dist
    to: ui
  - from: desktop/icon.ico
    to: icon.ico
win:
  target: dir
  signAndEditExecutable: false
artifactName: EdgeLens-${version}-${arch}.${ext}
