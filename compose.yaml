name: edgelens
services:
  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  backend:
    build:
      context: ./backend
      args:
        ML_EXTRA: ${ML_EXTRA:-onnx}
    environment:
      APP_ENV: ${APP_ENV:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      EDGELENS_DATA_DIR: /data
      TORCH_HOME: /data/weights
    volumes:
      - edgelens_data:/data
    expose:
      - "8000"
    restart: unless-stopped
volumes:
  edgelens_data:
